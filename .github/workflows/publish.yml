name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  issues: write
  contents: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package integrity
        run: |
          npm pack --dry-run
          echo "Package name: $(node -p 'require(\"./package.json\").name')"
          echo "Package version: $(node -p 'require(\"./package.json\").version')"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 提取当前版本段：从 ## [VERSION] 到下一个 ## [ 开头（或文件尾）
          sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md \
            | sed '$d' \
            | sed '1d' \
            > /tmp/release_body.txt
          echo "=== Release body for ${VERSION} ==="
          cat /tmp/release_body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release_body.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        run: |
          echo "## ✅ Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: \`$(node -p 'require("./package.json").name')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$(node -p 'require("./package.json").version')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **npm**: https://www.npmjs.com/package/$(node -p 'require(\"./package.json\").name')" >> $GITHUB_STEP_SUMMARY
